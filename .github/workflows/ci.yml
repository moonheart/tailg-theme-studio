name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Build Binary
        run: go build -o theme-studio-ci.exe .
